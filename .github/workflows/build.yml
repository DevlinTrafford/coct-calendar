name: Build calendar

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC (06:00 SAST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # A non-zero exit (source broke or looked empty) fails the run, which emails the repo owner.
      # The last-good data is still used, so the commit step below runs regardless.
      - id: build
        run: python build_calendar.py
        continue-on-error: true
      - name: Commit changes
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
      - name: Fail if the build reported a problem
        if: steps.build.outcome == 'failure'
        run: exit 1
